# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish" # UNCOMMENT THIS LINE
# baseURL = "https://your_domain.com/"
defaultContentLanguage = "en"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

# Zen mode button only on blog posts, not CTFs/resume/other pages
[[cascade]]
  showZenMode = true
  [cascade.target]
    path = "/posts/**"

# Keep taxonomy pages out of the sitemap. 45 of the 70 entries were tag pages
# and 34 of those list a single post, so they are duplicates of that post's
# title and summary with no content of their own. They stay crawlable and
# linked from every article; they are just not advertised as important URLs.
[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade.target]
    kind = "{taxonomy,term}"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  # Writeups are not edited daily; 'weekly' stops crawlers from treating every
  # lastmod as stale noise. Per-page priority is set in params.toml/front matter.
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# Plain-text site index for LLM crawlers (Blowfish ships layouts/_default/llms.txt).
# Note: as of 2026 no major AI vendor has committed to reading /llms.txt, and
# server-log studies show it is rarely fetched. Kept because it costs nothing.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
