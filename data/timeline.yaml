# Timeline entries rendered by layouts/shortcodes/timeline.html on /news/.
#
# Required: date (QUOTED "YYYY-MM-DD"), kind, title
# Optional: id, url, vendor, summary, severity, cvss, payout, currency, links[]
#
# id:       the identifier the entry is known by (CVE-..., report number). Shown
#           in place of the kind tag, so the tag itself carries the reference.
#
# kind:     cve | bounty | project | ctf | post | talk | news  (tag colour)
# severity: critical | high | medium | low            (overrides the colour)
# payout:   plain number, no separators. currency defaults to USD.
#
# Order does not matter, the shortcode sorts by date descending.
#
# CTF writeups are not listed here: the shortcode reads them from content/ctfs/.

- date: "2026-07-12"
  kind: cve
  id: "CVE-2026-77386"
  severity: "medium"
  cvss: "6.5"
  title: "OIDC login token can be redirected to an attacker-controlled URL"
  vendor: "Kyoo"
  url: "https://github.com/zoriya/Kyoo/security/advisories/GHSA-xhg6-v78p-xf44"
  summary: "The OIDC login flow accepted an attacker-supplied redirect target, handing the issued token to a URL outside the application."
  links:
    - text: "Advisory"
